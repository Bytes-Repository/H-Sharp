[package]
name = "hsharp-hlib"
version = "0.9.0"
edition = "2021"
authors = ["HackerOS Team <hackeros068@gmail.com>"]
license = "MPL-2.0"
description = "H#'s native reader/writer for the HackerOS .hlib library archive format. Vendored locally — not published to crates.io, and not shared with Hacker Lang's or HackerScript's own .hlib modules (see /HLIB_FORMAT.md for why each toolchain keeps an independent copy of this logic)."
publish = false

[lib]
name = "hsharp_hlib"
path = "src/lib.rs"

# Deliberately its own small dependency island rather than folding into
# `hsharp-compiler` — see hlib/src/lib.rs's module doc comment for why
# (this is the one part of the H# toolchain most likely to get rewritten
# in H# itself once H# is self-hosted, so it's kept from leaking into
# any other crate's API).
[dependencies]
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2       = "0.10"
tar        = "0.4"
zstd       = "0.13"
ed25519-dalek = { version = "=2.0.0", default-features = false, features = ["rand_core", "std"] }
rand       = "0.8"
zeroize    = "=1.7.0"
base64ct   = "=1.6.0"
jobserver  = "=0.1.32"
cc         = "=1.0.100"
hex        = "0.4"
thiserror  = "1.0"

[dev-dependencies]
tempfile = "=3.10.1"
